name: Android APK
on:
  push:
    branches: [main]
    paths: ['android-apk/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare official launcher icon
        run: |
          mkdir -p android-apk/app/src/main/res/drawable
          cp apps/web/public/icons/icon-512.png android-apk/app/src/main/res/drawable/app_icon.png

      - name: Build installable APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk ForteVendas.apk
      - name: Publish stable Android download
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: 'Forte Vendas Android'
          artifacts: 'ForteVendas.apk'
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
