name: WhatsApp token e webhook
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test checks/whatsapp-token-only.test.mjs checks/whatsapp-token-ui.test.mjs checks/whatsapp-webhook-server.test.mjs checks/invitation-configure.test.mjs
